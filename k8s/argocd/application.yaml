apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shoplite-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/GehanLiyanage2002/shoplite-gitops-infra.git
    targetRevision: main
    path: k8s/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: shoplite
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true