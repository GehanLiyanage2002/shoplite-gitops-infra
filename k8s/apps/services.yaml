apiVersion: v1
kind: Service
metadata:
  name: shoplite-active
  namespace: shoplite
  labels:
    app: shoplite-api
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app: shoplite-api
---
apiVersion: v1
kind: Service
metadata:
  name: shoplite-preview
  namespace: shoplite
  labels:
    app: shoplite-api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app: shoplite-api