apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: shoplite-rollout
  namespace: shoplite
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: shoplite-api
  template:
    metadata:
      labels:
        app: shoplite-api
    spec:
      containers:
        - name: shoplite-api
          image: shopliteacr2026.azurecr.io/shoplite-api:7866b07
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shoplite-db-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
  strategy:
    blueGreen:
      activeService: shoplite-active
      previewService: shoplite-preview
      autoPromotionEnabled: false